<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set password — Website Cloner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-brand"><i class="bi bi-globe2"></i><span>Website Cloner</span></div>
      <h1 class="auth-title">Set your password</h1>
      <p class="auth-sub">Choose a password with at least 10 characters.</p>

      <form id="resetForm" novalidate>
        <label class="form-label" for="password">New password</label>
        <input class="form-control" id="password" type="password" autocomplete="new-password" minlength="10" required autofocus />
        <label class="form-label mt-3" for="confirm">Repeat password</label>
        <input class="form-control" id="confirm" type="password" autocomplete="new-password" minlength="10" required />
        <div class="auth-error d-none" id="resetError" role="alert"></div>
        <button class="btn btn-primary w-100 mt-4" id="resetBtn" type="submit">Save password</button>
      </form>
      <div class="auth-success d-none" id="resetDone">
        <i class="bi bi-check-circle me-1"></i>Password saved. <a href="/login.html">Sign in</a>
      </div>
    </main>
    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>

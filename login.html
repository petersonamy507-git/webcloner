<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Website Cloner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-brand"><i class="bi bi-globe2"></i><span>Website Cloner</span></div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Use the account your administrator created for your workspace.</p>

      <form id="loginForm" novalidate>
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="username" required autofocus />
        <label class="form-label mt-3" for="password">Password</label>
        <input class="form-control" id="password" type="password" autocomplete="current-password" required />
        <div class="auth-error d-none" id="loginError" role="alert"></div>
        <button class="btn btn-primary w-100 mt-4" id="loginBtn" type="submit">Sign in</button>
      </form>
      <p class="auth-foot">Forgot your password? Ask your workspace admin for a reset link.</p>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
